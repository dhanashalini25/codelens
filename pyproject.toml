[project]
name = "codelens"
version = "0.1.0"
description = "Repository intelligence and AI-assisted code review"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "typer>=0.12",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dense = ["sentence-transformers>=2.6"]
dev = ["pytest>=8.0"]

[project.scripts]
codelens = "codelens.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["codelens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
